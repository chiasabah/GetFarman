:root{
  /* Layout: a facing-page edition of your own prompts. Each prompt is a row
     that runs the full width of the canvas: what you said on the left, the
     better prompt on the right. Groups are split by a wavy rule. Colour is
     spent only on the matched phrases; the chrome is one ink on cream.
     Class names say what a thing is: .session-title, .entry-project, .prompt-row. */
  --canvas:#f4eedf; --panel:#faf6ea; --ink:#1e1a14; --muted:#6d6555;
  --line:rgba(30,26,20,.13); --line-2:rgba(30,26,20,.28);
  --s1:#2f58c4; --s2:#7446b8; --s3:#1c7f68; --s4:#a86a12; --s5:#b83d63; --s6:#4b6472; --s7:#8a5a3c; --s8:#5b7a1f;
  --tint:13%; --note:#6b4f00; --note-fill:#f4e19c;
  --font:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --canvas:#0a0a0a; --panel:#171717; --ink:#fafafa; --muted:#a3a3a3;
    --line:rgba(250,250,250,.11); --line-2:rgba(250,250,250,.26);
    --s1:#7ea6ff; --s2:#b896f8; --s3:#4fd1ae; --s4:#efb252; --s5:#f487a6; --s6:#9db4c0; --s7:#d6a27e; --s8:#a9cc5e;
    --tint:20%; --note:#f5cf47; --note-fill:#302808; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --canvas:#0a0a0a; --panel:#171717; --ink:#fafafa; --muted:#a3a3a3;
  --line:rgba(250,250,250,.11); --line-2:rgba(250,250,250,.26);
  --s1:#7ea6ff; --s2:#b896f8; --s3:#4fd1ae; --s4:#efb252; --s5:#f487a6; --s6:#9db4c0; --s7:#d6a27e; --s8:#a9cc5e;
  --tint:20%; --note:#f5cf47; --note-fill:#302808; color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 var(--font);color:var(--ink);background:var(--canvas);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
h1,h2,h3,p,ul{margin:0}
[hidden]{display:none!important}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px;border-radius:4px}

/* ---------- scroll rail ----------
   A thin bar at the edge of every box that scrolls. It shows where you are, in place of the
   browser's scrollbar, which is hidden everywhere. The wheel, a trackpad, the keys and touch
   still scroll. The script at the end of the page places one rail for each box and each axis.
   A box sets its own insets: --rail-size, --rail-top, --rail-bottom, --rail-right. */
*{scrollbar-width:none}
::-webkit-scrollbar{width:0;height:0}
.rail-host{position:relative}
.scroll-rail{position:absolute;left:0;top:0;width:0;height:0;z-index:4;border-radius:99px;background:color-mix(in srgb,var(--ink) 9%,transparent);opacity:0;pointer-events:none;transition:opacity .18s ease-out;touch-action:none}
.scroll-rail::before{content:"";position:absolute;inset:0 -2px 0 -8px}      /* easier to catch than a bar of 5px */
.scroll-rail.is-horizontal::before{inset:-8px 0 -2px 0}
.scroll-rail.is-on{opacity:1;pointer-events:auto}
.scroll-rail i{display:block;width:100%;height:100%;border-radius:99px;background:color-mix(in srgb,var(--ink) 40%,transparent)}
.scroll-rail:hover i,.scroll-rail.is-drag i{background:color-mix(in srgb,var(--ink) 60%,transparent)}
#logScroller,#cards{--rail-size:6px;--rail-right:4px}
.sidebar-scroll{--rail-top:44px}      /* starts below the fold button */
.rail-projects{--rail-size:3px;--rail-top:2px;--rail-bottom:2px;--rail-right:2px}
#settingsPanel{--rail-top:12px;--rail-bottom:12px}
#instructionsText{--rail-top:8px;--rail-bottom:8px;--rail-right:4px}
.config-file{--rail-size:4px;--rail-top:8px;--rail-bottom:8px}

/* ---------- controls ---------- */
.button{border:1px solid var(--line-2);background:transparent;border-radius:8px;padding:6px 12px;font-weight:550;font-size:13px;white-space:nowrap}
.button:hover:not(:disabled){background:color-mix(in srgb,var(--ink) 7%,transparent)}
.button-solid{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.button-solid:hover:not(:disabled){background:color-mix(in srgb,var(--ink) 86%,var(--panel))}
.button:disabled{opacity:.45}
.button-small{padding:4px 10px;font-size:12.5px}
.button-icon{width:34px;height:32px;padding:0;display:inline-grid;place-items:center;flex:none}
.button-icon svg{width:16px;height:16px;display:block}
.text-button{border:0;background:none;padding:0;font-size:13px;white-space:nowrap;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.text-button:hover{text-decoration-color:var(--ink)}
.text-button-small{font-size:12.5px}
.segmented{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;padding:2px;gap:2px}
.segmented button{border:0;background:none;padding:4px 10px;border-radius:6px;font-size:13px;font-weight:550;color:var(--muted);white-space:nowrap}
.segmented button:hover{color:var(--ink)}
.segmented button[aria-checked="true"]{background:var(--ink);color:var(--panel)}
.segmented-wide{display:flex}
.segmented-wide button{flex:1;padding:4px 2px;font-size:12.5px}
.switch{appearance:none;border:1px solid var(--line-2);background:transparent;width:30px;height:18px;border-radius:99px;position:relative;padding:0;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:10px;height:10px;border-radius:50%;background:var(--muted);transition:transform .16s ease-out}
.switch[aria-checked="true"]{background:var(--ink);border-color:var(--ink)}
.switch[aria-checked="true"]::after{transform:translateX(12px);background:var(--panel)}
.switch-row{display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer}
.status-chip{--c:var(--s6);font-size:12px;border:1px solid var(--c);color:var(--c);background:color-mix(in srgb,var(--c) var(--tint),var(--panel));border-radius:99px;padding:1px 9px;white-space:nowrap}
.status-chip.is-live{--c:var(--s3)} .status-chip.is-offline{--c:var(--s5)}
button.status-chip{font-family:inherit;line-height:inherit;cursor:pointer}
button.status-chip:hover{background:color-mix(in srgb,var(--c) 26%,var(--panel))}
.state-glyph{width:12px;height:12px;flex:none;fill:color-mix(in srgb,var(--c) var(--tint),var(--surface,var(--panel)));stroke:var(--c);stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round}
.state-glyph.is-better{--c:var(--s4)} .state-glyph.is-precise{--c:var(--s3)} .state-glyph.is-pending{--c:var(--s6)}
.arrow{width:13px;height:9px;margin:0 7px;stroke:var(--muted);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;vertical-align:0}
.chevron{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .16s ease-out}
[aria-expanded="true"]>.chevron{transform:rotate(90deg)}
.search-box{display:flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:9px;padding:0 8px;background:var(--canvas)}
.search-icon{width:14px;height:14px;flex:none;color:var(--muted)}
.search-box input{flex:1;min-width:0;border:0;background:none;padding:6px 2px;outline:none;-webkit-appearance:none;appearance:none;font-size:13.5px}
.search-box input::placeholder{color:var(--muted)}
.search-box:focus-within{outline:2px solid var(--s1);outline-offset:1px}
.search-hit{background:color-mix(in srgb,var(--ink) 18%,transparent);border-radius:2px}
kbd{font:12px var(--font);color:var(--muted);border:1px solid var(--line-2);border-radius:5px;padding:0 6px}
.hint{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.hint.is-error{color:var(--s5)}

/* ---------- app bar: the name, where you are, the coach ---------- */
.app-bar{position:relative;z-index:10;display:flex;align-items:center;gap:8px 16px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.app-brand{display:flex;align-items:center;gap:10px;flex:none}
.app-icon{width:22px;height:22px;flex:none;margin-right:-2px}
.app-name{font-size:15px;font-weight:650;letter-spacing:-.01em}
.location{flex:1 1 0;min-width:0;display:flex;align-items:baseline;gap:10px;padding:4px 4px 4px 16px;border-left:1px solid var(--line);white-space:nowrap;overflow:hidden}
.location-project{border:0;background:none;padding:0;color:var(--muted);font-size:14px;font-weight:550;flex:0 2 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.location-project:hover{color:var(--ink)}
.location-separator{color:var(--line-2);flex:none}
.location-title{font-size:15px;line-height:1.3;font-weight:650;letter-spacing:-.01em;flex:0 1 auto;min-width:40px;overflow:hidden;text-overflow:ellipsis}
.location-facts{display:flex;gap:14px;color:var(--muted);font-size:13px;flex:none}
.prompt-search{flex:0 1 260px;min-width:150px}
.view-switch{flex:none}
.app-tools{display:flex;align-items:center;gap:10px;flex:none}
.coach-status{color:var(--muted);font-size:13px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- settings panel ---------- */
.settings-panel{position:absolute;right:16px;top:calc(100% + 8px);width:min(404px,calc(100vw - 32px));max-height:calc(100vh - 80px);overflow-y:auto;background:var(--panel);border:1px solid var(--line-2);border-radius:12px;padding:16px;box-shadow:0 14px 36px rgba(0,0,0,.16);display:grid;gap:14px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline}
.panel-head h2{font-size:16px;font-weight:650;letter-spacing:-.01em}
.setting{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 12px}
.setting-label{font-weight:550}
.setting .hint,.setting .switch-row{grid-column:1/-1}
.setting.has-rule,.config-head.has-rule{border-top:1px solid var(--line);padding-top:12px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper output{min-width:22px;text-align:center;font-weight:650;font-size:15px}
.stepper .button{width:28px;padding:3px 0;text-align:center}
.config-head{display:flex;justify-content:space-between;align-items:baseline;font-weight:550;gap:10px}
.config-path{overflow-wrap:anywhere;min-width:0}
.config-head button{flex:none}
.config-file{margin:-6px 0 0;font:13px/20px var(--font);font-variant-ligatures:none;font-kerning:none;white-space:pre;background:color-mix(in srgb,var(--ink) 6%,var(--panel));border-radius:8px;padding:10px 12px;overflow-x:auto}

/* ---------- the reviewer's instructions, edited in place ---------- */
.instructions-editor{position:fixed;z-index:20;top:60px;right:16px;bottom:16px;width:min(680px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line-2);border-radius:12px;padding:16px;box-shadow:0 14px 36px rgba(0,0,0,.16);display:flex;flex-direction:column;gap:10px}
.instructions-editor textarea{flex:1;min-height:160px;resize:none;border:1px solid var(--line-2);border-radius:8px;background:var(--canvas);color:var(--ink);padding:10px 12px;font:13.5px/1.5 var(--font)}
.instructions-editor textarea:focus{outline:2px solid var(--s1);outline-offset:1px}
.instructions-editor details{font-size:12.5px;color:var(--muted)}
.instructions-editor summary{cursor:pointer}
.instructions-editor pre{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font:12.5px/1.5 var(--font);max-height:110px;overflow-y:auto}
.editor-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.editor-note{margin-left:auto;font-size:13px}

/* ---------- workspace: sidebar and log ---------- */
.workspace{flex:1;min-height:0;display:grid;grid-template-columns:272px minmax(0,1fr)}
.sidebar{background:var(--panel);border-right:1px solid var(--line);min-height:0;display:flex;flex-direction:column}
.sidebar-toggle{display:none}
.sidebar-body{flex:1;min-height:0;display:flex;flex-direction:column}
.sidebar-scroll{flex:1;min-height:0;overflow-y:auto;padding:12px 17px 20px 12px}
.sidebar-filters{flex:none;border-top:1px solid var(--line);padding:10px 12px 12px}
.sidebar-section{margin-top:18px}
.sidebar-filters .sidebar-section{margin-top:12px}
.sidebar-heading-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 8px 6px}
.sidebar-heading{font-size:12.5px;font-weight:600;color:var(--muted)}
button.sidebar-heading{border:0;background:none;padding:0;display:inline-flex;align-items:center;gap:6px}
button.sidebar-heading:hover{color:var(--ink)}
.sidebar-heading-note{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* how the session list is arranged */
.view-options{display:grid;gap:10px;margin:2px 0 12px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--canvas);font-size:13px}
.view-option{display:grid;gap:5px}
.view-option-label{font-size:12.5px;color:var(--muted)}

/* entries: all sessions, a project, a session, a term */
.entry{display:grid;grid-template-columns:minmax(0,1fr);width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:8px;gap:1px}
.entry:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.entry[aria-current="true"],.entry[aria-pressed="true"]{background:color-mix(in srgb,var(--ink) 10%,transparent)}
.entry-line{display:flex;justify-content:space-between;gap:8px;align-items:baseline;min-width:0}
.entry-name{font-weight:550;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry-count{color:var(--muted);font-size:12.5px;flex:none}
.entry-detail{display:flex;gap:10px;color:var(--muted);font-size:12.5px;min-width:0;white-space:nowrap;overflow:hidden}
.entry-detail>*{overflow:hidden;text-overflow:ellipsis}
.entry-project{color:var(--muted);font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry-note{color:var(--muted);font-size:12.5px;margin:2px 8px 6px}
.project-entry{display:grid;grid-template-columns:18px minmax(0,1fr);align-items:start;margin-top:2px}
.project-toggle{border:0;background:none;padding:0;width:18px;height:32px;display:grid;place-items:center;color:var(--muted);border-radius:5px}
.project-toggle:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 7%,transparent)}
.project-name{font-weight:650}
.project-sessions{margin:0 0 6px 18px;border-left:1px solid var(--line);padding-left:4px}
.session-entry .entry-name{font-size:13.5px}
.state-mix{display:flex;height:4px;gap:2px;margin-top:4px}
.state-mix i{display:block;height:100%;border-radius:2px;min-width:3px}
.state-mix .is-better{background:var(--s4)} .state-mix .is-precise{background:var(--s3)} .state-mix .is-pending{background:var(--line-2)}
.show-more{margin:6px 8px 0}

/* filters, pinned under the lists */
.period-custom{display:grid;gap:6px;margin:8px 2px 0}
.period-custom label{display:grid;grid-template-columns:36px minmax(0,1fr);align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.period-custom input{border:1px solid var(--line-2);border-radius:7px;background:var(--canvas);padding:4px 6px;min-width:0;font-size:12.5px}
.state-filter{display:grid;grid-template-columns:14px minmax(0,1fr) auto 30px;align-items:center;gap:8px;padding:4px 8px;border-radius:8px}
.state-filter.has-rule{margin-top:4px;padding-top:9px;border-top:1px solid var(--line);border-radius:0}
.state-filter .state-only{display:none;font-size:12px;color:var(--muted)}
.state-filter:hover .state-only,.state-filter:focus-within .state-only{display:inline}
.state-filter:hover .state-count,.state-filter:focus-within .state-count{display:none}
.state-count{color:var(--muted);font-size:12.5px}

/* ---------- the log ---------- */
.log{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--canvas);--surface:var(--canvas);outline:none}
.log-scroller{flex:1;min-height:0;overflow-y:auto;position:relative;overflow-anchor:none}
.log-list{position:relative}
.log-window{position:absolute;top:0;left:0;right:0}
.log-row.is-loading{display:flex;align-items:center;padding:0 24px 0 84px;color:var(--muted);border-top:1px solid var(--line)}

/* the table's header row holds the column names and nothing else */
.column-heads{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1fr);column-gap:28px;align-items:center;padding:5px 24px 5px 16px;min-height:30px;background:var(--canvas);border-bottom:1px solid var(--line)}
.column-heads[data-view="reviews"]{grid-template-columns:40px minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.1fr) 92px;column-gap:22px}
.column-heads[data-view="cards"]{grid-template-columns:var(--card-columns);column-gap:22px;padding:5px 24px}
.column-head{font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.column-select{display:flex;justify-content:flex-end;overflow:visible}
.column-total{font-weight:400;margin-left:10px}
.select-all{border:0;background:none;padding:2px;margin-right:-4px;border-radius:5px;line-height:0;color:var(--muted)}
.select-all svg{width:16px;height:16px;display:block}
.select-all:hover:not(:disabled),.select-all[aria-pressed="true"],.select-all[aria-pressed="mixed"]{color:var(--ink)}
.select-all:disabled{opacity:.35}
.column-sort{border:0;background:none;padding:0;font:inherit;color:inherit;display:inline-flex;align-items:center;gap:5px;max-width:100%}
.column-sort:hover,.column-head[data-sort="ascending"],.column-head[data-sort="descending"]{color:var(--ink)}
.sort-arrow{width:10px;height:10px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transform:rotate(90deg)}
.column-head[data-sort="ascending"] .sort-arrow{transform:rotate(-90deg)}
.column-head[data-sort="none"] .sort-arrow{visibility:hidden}

/* shown only while a filter narrows the list or prompts are selected */
.context-strip{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:7px 24px 7px 16px;background:var(--canvas);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.strip-filters,.strip-selection{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.strip-selection{margin-left:auto}
.filter-tag{border:1px solid var(--line-2);background:none;border-radius:99px;padding:2px 10px;font-size:12.5px;color:var(--ink);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.notice{padding:8px 24px;color:var(--muted);border-bottom:1px dashed var(--line-2)}
.notice code,.empty-state code{font:inherit;background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:5px;padding:1px 6px}

/* headings inside the list */
.project-head,.session-head{font-size:inherit;font-weight:400}
.project-head{padding:18px 24px 0;display:flex;flex-wrap:wrap;gap:2px 14px;align-items:baseline}
.project-head+.session-head{padding-top:6px}
.project-title{border:0;background:none;padding:0;font-size:13px;font-weight:650;color:var(--muted);text-align:left}
.project-title:hover{color:var(--ink)}
.project-path{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.session-head{padding:16px 24px 0;display:flex;flex-wrap:wrap;gap:2px 14px;align-items:baseline}
.session-title{border:0;background:none;padding:0;font-size:16px;font-weight:650;letter-spacing:-.012em;text-align:left;overflow-wrap:anywhere}
.session-title:hover{text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.session-facts{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:13px;color:var(--muted)}
.group-divider{display:block;height:8px;width:calc(100% - 48px);margin:28px 24px 12px}
.group-divider-line{fill:none;stroke:var(--line-2);stroke-width:1.2;stroke-linecap:round}
.group-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 14px;padding:14px 24px 12px;font-size:13px;color:var(--muted)}
.group-name{color:var(--ink);font-weight:650;font-size:14px;margin-right:10px}
.group-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

/* the facing pages: one prompt, said on the left and better on the right */
.prompt-row{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1fr);column-gap:28px;padding:16px 24px 15px 16px;border-top:1px solid var(--line)}
.prompt-row.is-selected,.review-row.is-selected{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.prompt-gutter{display:flex;flex-direction:column;align-items:flex-end;gap:8px;padding-top:2px;color:var(--muted);font-size:13px}
.prompt-number{border:0;background:none;padding:0 3px;margin-right:-3px;min-width:20px;text-align:right;color:var(--muted);border-radius:5px;font-size:13px;line-height:1.5}
.prompt-number:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 9%,transparent)}
.prompt-number[aria-pressed="true"]{background:var(--ink);color:var(--canvas);padding:0 6px;text-align:center}
.prompt-expand{border:0;background:none;padding:2px;margin-right:-3px;border-radius:5px;line-height:0;color:var(--muted)}
.prompt-expand:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 7%,transparent)}
.said-text,.better-text{font-size:15.5px;line-height:1.5;max-width:60ch;overflow-wrap:anywhere;white-space:pre-wrap}
.said-text.is-clamped{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:8;line-clamp:8;overflow:hidden}
.better-cell{position:relative}
.better-cell::before{content:"";position:absolute;left:-14px;top:3px;bottom:3px;border-left:1px solid var(--line)}
.cell-label{display:none}
.muted-text{color:var(--muted);font-size:14px;line-height:1.6}
.better-cell .button{margin-top:8px}
.cell-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.word-count{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.word-bar{height:3px;border-radius:2px;display:block;background:var(--line-2)}
.word-bar.is-better{background:var(--ink)}
.prompt-time{font-size:12px;color:var(--muted)}
.pair-list{list-style:none;padding:0;margin-top:12px;display:grid;gap:8px;font-size:13px;line-height:1.55}
.term-gloss{color:var(--muted);display:block;margin-top:1px}
.review-reason{margin-top:10px;font-size:13px;color:var(--muted);max-width:60ch}
.review-reason b{color:var(--ink);font-weight:600;margin-right:6px}
.reply{grid-column:2/-1;margin-top:14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;font-size:13.5px;color:var(--muted)}
.reply-author{font-weight:600;color:var(--ink);font-size:12.5px}
.reply-text{max-width:78ch;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.prompt-row.is-open .reply-text{display:block;overflow:visible;white-space:pre-wrap}
.reply-files{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;max-width:300px}
.file-chip{font-size:12px;border:1px solid var(--line-2);border-radius:6px;padding:0 6px;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}

/* the one place colour is spent: a lay phrase and its term */
mark{background:none;color:inherit}
.lay-phrase,.term{--c:var(--s1);background:color-mix(in srgb,var(--c) var(--tint),var(--surface,var(--panel)));border-radius:3px;padding:1px 3px;text-decoration:underline 1.5px var(--c);text-underline-offset:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.lay-phrase{text-decoration-style:dashed}
.term{text-decoration-style:solid;font-weight:600}
.pair-1{--c:var(--s1)} .pair-2{--c:var(--s5)} .pair-3{--c:var(--s2)} .pair-4{--c:var(--s8)}
.is-focused .said-text,.is-focused .better-text,.is-focused .pair,.is-focused .review-cell{color:color-mix(in srgb,var(--ink) 36%,transparent)}
.is-focused .lay-phrase,.is-focused .term{background:none;text-decoration-color:transparent}
.is-focused .term-gloss{color:inherit}
.is-focused .is-lit,.is-focused .pair.is-lit .lay-phrase,.is-focused .pair.is-lit .term{color:var(--ink);background:color-mix(in srgb,var(--c) var(--tint),var(--surface,var(--panel)));text-decoration-color:var(--c)}
.is-focused .pair.is-lit,.is-focused .pair.is-lit .term-gloss{color:var(--muted)}

/* what a review of several prompts found */
.group-summary{padding:13px 24px 2px 84px;border-top:1px solid var(--line);display:grid;gap:8px;font-size:13.5px}
.group-summary b{font-weight:650;margin-right:8px}
.terms-kept{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;align-items:baseline}
.terms-kept-label{color:var(--muted);flex-basis:100%}
.terms-kept .lay-phrase,.terms-kept .term{background:none;padding:0}
.terms-kept .lay-phrase{--c:var(--muted)} .terms-kept .term{--c:var(--ink)}
.term-pair{display:inline-block;max-width:100%}

/* reviews view: the group of prompts as one table */
.review-row{display:grid;grid-template-columns:40px minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.1fr) 92px;column-gap:22px;padding:11px 24px 11px 16px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.5}
.review-row .prompt-gutter{padding-top:0}
.review-cell{overflow-wrap:anywhere}
.review-said-text{white-space:pre-wrap}
.review-said-text.is-clamped{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:6;line-clamp:6;overflow:hidden}
.review-row .review-reason{margin-top:8px}
.review-status{grid-column:3/-1;color:var(--muted)}
.review-cell .pair-list{margin:0}
.pair-flag{display:inline-block;margin:3px 0 0;font-size:12px;color:var(--muted);border:1px dashed var(--line-2);border-radius:99px;padding:0 8px;white-space:nowrap}

.review-words{color:var(--muted)}
.review-words .arrow{margin:0 5px}
.review-words-unit{display:block;font-size:12px}

/* system text that an app put in front of your prompt: its own block, in yellow */
.system-note{width:fit-content;max-width:min(60ch,100%);margin:0 0 9px;border:1px solid var(--note);border-radius:9px;background:var(--note-fill);color:var(--ink)}
.system-note.is-open{width:auto}
.system-note-toggle{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;width:100%;border:0;background:none;padding:4px 10px 4px 8px;text-align:left;color:var(--note);font-size:12.5px;font-weight:600;border-radius:8px}
.system-note-hint{font-weight:400}
.system-note-body{padding:2px 12px 10px;display:grid;gap:9px;font-size:13px;line-height:1.5}
.system-note-kind{display:block;font-size:12px;font-weight:600;color:var(--note)}
.system-note-text{white-space:pre-wrap;overflow-wrap:anywhere}

/* cards: one row for each term, with its definition and what you said instead */
.log{--card-columns:minmax(130px,.9fr) minmax(0,1.7fr) minmax(0,1.3fr) minmax(100px,.8fr) 150px 52px}
.cards{flex:1;min-height:0;overflow-y:auto;padding-bottom:72px}
.card-row{display:grid;grid-template-columns:var(--card-columns);column-gap:22px;padding:11px 24px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.5;align-items:start}
.card-row:first-child{border-top:0}
.card-cell{min-width:0;overflow-wrap:anywhere}
.card-label{display:none}
.term-button{border:0;background:none;padding:0;text-align:left;font-size:14px;max-width:100%}
.term-button .term{--c:var(--ink);background:none;padding:1px 0}
.term-button:hover .term{background:color-mix(in srgb,var(--ink) 9%,transparent)}
.card-said{display:grid;gap:3px;justify-items:start}
.card-said .lay-phrase{--c:var(--muted);background:none;padding:1px 0}
.card-project,.card-when,.card-times{color:var(--muted);font-size:13px}

.rail-button{width:36px;height:32px;flex:none;border:0;background:none;border-radius:8px;color:var(--muted);display:grid;place-items:center;padding:0}
.rail-button svg{width:16px;height:16px;display:block}
.rail-button:hover,.rail-filter:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 7%,transparent)}
.rail-filters{display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:8px;border-top:1px solid var(--line);width:100%}
.rail-filter{width:36px;height:28px;flex:none;border:0;background:none;border-radius:8px;display:grid;place-items:center;padding:0}
.rail-filter[aria-pressed="false"]{opacity:.35}
.rail-filter .state-glyph{width:14px;height:14px}

.empty-state{padding:28px 24px;display:grid;gap:10px;max-width:70ch;justify-items:start}

@media (max-width:1400px){ .location-dates{display:none} }

  .sidebar-scroll{overflow:visible;padding:0 0 12px}

  .column-heads[data-view="messages"],.column-heads[data-view="reviews"]{display:none}

  .card-times,.column-heads[data-view="cards"] .column-head:last-child{text-align:left;justify-self:start}
  .card-label{display:inline;margin-right:6px}
  .cell-label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:3px}
  .group-head,.notice,.empty-state{padding-left:16px;padding-right:16px}
  .session-head{padding:14px 16px 0}
  .project-head{padding:16px 16px 0}
  .group-divider{width:calc(100% - 32px);margin:24px 16px 8px}
  .prompt-row{grid-template-columns:26px minmax(0,1fr);column-gap:10px;padding:14px 16px 14px 8px}
  .prompt-row .said-cell,.prompt-row .better-cell,.prompt-row .reply{grid-column:2}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
(function(){
'use strict';
const TOKEN='__FERMANDE_TOKEN__', NEEDS='0.4.0';
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>Number(n||0).toLocaleString('en-GB');
const n1=(n,w)=>num(n)+' '+(Number(n)===1?w:w+'s');
const cap=s=>String(s||'').charAt(0).toUpperCase()+String(s||'').slice(1);
const parts=p=>String(p||'').split(/[\\/]+/).filter(Boolean);
const base=p=>{ const a=parts(p); return a.length?a[a.length-1]:''; };
const LABEL={better:'Could be better',precise:'Already precise',pending:'Not reviewed yet'};
const ARROW='<svg class="arrow" aria-hidden="true"><use href="#glyph-arrow"/></svg><span class="visually-hidden"> means </span>';
const CHEVRON='<svg class="chevron" aria-hidden="true"><use href="#glyph-chevron"/></svg>';
const DIVIDER='<svg class="group-divider" aria-hidden="true"><rect width="100%" height="100%" fill="url(#squiggle)"/></svg>';
const KEY='fermande.page.v3', PAGE=50, OVER=700;
const VIEWS=[['messages','Messages'],['reviews','Reviews'],['cards','Glossary']];
const CARD_COLS=[['term','Term'],['gloss','Definition'],['said','You said'],['project','Project'],['last_at','Last used'],['times','Times']];
const NOTE_KIND={'system-reminder':'System reminder','task-notification':'Task notification'};
const UNUSED='<span class="pair-flag" title="The reviewer named this term but did not use it in the better prompt. A plain text comparison found this, not a model.">found, not used</span>';
const PERIODS=[['all','All'],['today','Today'],['7d','7 days'],['30d','30 days'],['custom','Custom']];
const SORTS=[['recent','Latest'],['started','Started'],['name','Name'],['size','Size']];
const SORT_HINT={recent:'The session with the latest prompt comes first.',started:'The session that started last comes first.',name:'Sessions in the order of the alphabet.',size:'The session with the most prompts comes first.'};
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const pad=n=>(n<10?'0':'')+n;
const clock=d=>pad(d.getHours())+':'+pad(d.getMinutes());
function fmt(ts){ if(!ts) return ''; const d=new Date(ts*1000), y=d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'';
  return DAYS[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]+y+', '+clock(d); }
function spanText(a,b){            // "Tue 10 Nov, 01:04 to 23:48", or two full dates when the days differ
  if(!a) return fmt(b); if(!b||b-a<60) return fmt(a);
  const x=new Date(a*1000), y=new Date(b*1000);
  return fmt(a)+' to '+(x.toDateString()===y.toDateString()?clock(y):fmt(b)); }
function older(v,than){ const a=String(v||'0').split('.').map(Number), b=than.split('.').map(Number);
  for(let i=0;i<3;i++){ if((a[i]||0)!==(b[i]||0)) return (a[i]||0)<(b[i]||0); } return false; }

/* scope is 'all', 'project:<folder>' or a session id */
const state={scope:'all',view:'messages',show:{better:true,precise:true,pending:true},replies:true,q:'',sq:'',term:null,period:'all',
  arrange:'project',sort:'recent',newest:true,entry:{dates:true,counts:true,bars:true},expanded:new Set(),closed:new Set(),viewOptions:false,
  collapsed:false,cardSort:{key:'last_at',dir:'desc'},notes:new Set(),open:new Set(),sel:new Set(),allTerms:false,sidebarOpen:false,settings:false,note:'',copied:null,sessLimit:300};
let ov=null, online=true, total=0, wordsTot=null, stamp=null, version=null, build=null, gen=0, ovSeq=0, Q={};
let pages=new Map(), inflight=new Map(), reviews=new Map(), sessMeta=new Map(), labels=new Map(), cards=null;
const H={messages:new Map(),reviews:new Map(),cards:new Map()};
let off=new Float64Array(1), drawn={first:-1,last:-1}, dirty=true, raf=0;

/* what you chose stays chosen: the theme and how the sidebar is arranged */
try{
  const read=k=>JSON.parse(localStorage.getItem(k)||'null'), v1=read('fermande.page.v1'), v2=read('fermande.page.v2'), v3=read(KEY), saved=v3||v2||{};
  const th=saved.theme||(v1&&v1.theme); if(th==='dark'||th==='light') document.documentElement.dataset.theme=th;
  if(saved.arrange==='project'||saved.arrange==='list') state.arrange=saved.arrange;
  if(SORTS.some(x=>x[0]===saved.sort)) state.sort=saved.sort;
  if(v3&&typeof v3.newest==='boolean') state.newest=v3.newest;      // from 0.4 on, the newest prompt comes first unless you chose otherwise
  if(saved.entry) Object.keys(state.entry).forEach(k=>{ if(typeof saved.entry[k]==='boolean') state.entry[k]=saved.entry[k]; });
  if(Array.isArray(saved.expanded)) state.expanded=new Set(saved.expanded);
  if(Array.isArray(saved.closed)) state.closed=new Set(saved.closed);
  if(typeof saved.replies==='boolean') state.replies=saved.replies;
  if(saved.view==='reviews'||saved.view==='cards') state.view=saved.view;
  if(v3){ state.collapsed=!!v3.collapsed;
    if(v3.cardSort&&CARD_COLS.some(c=>c[0]===v3.cardSort.key)) state.cardSort={key:v3.cardSort.key,dir:v3.cardSort.dir==='asc'?'asc':'desc'}; }
}catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify({theme:document.documentElement.dataset.theme||null,arrange:state.arrange,sort:state.sort,
  newest:state.newest,entry:state.entry,expanded:Array.from(state.expanded).slice(-200),closed:Array.from(state.closed),replies:state.replies,view:state.view,collapsed:state.collapsed,cardSort:state.cardSort})); }catch(e){} }
function theme(){ return document.documentElement.dataset.theme||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); }
const scopeKind=()=>state.scope==='all'?'all':state.scope.indexOf('project:')===0?'project':'session';

async function api(path,body){
  const r=await fetch(path,{method:body?'POST':'GET',cache:'no-store',
    headers:Object.assign({'X-Fermande-Token':TOKEN},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined});
  let data=null; try{ data=await r.json(); }catch(e){}
  if(!r.ok) throw new Error(data&&data.error?data.error:'Fermande answered with an error ('+r.status+').');
  return data;
}

/* ---------- the query in force ---------- */
function range(){
  const now=Date.now()/1000;
  if(state.period==='today'){ const d=new Date(); d.setHours(0,0,0,0); return [d.getTime()/1000,'']; }
  if(state.period==='7d') return [now-7*86400,''];
  if(state.period==='30d') return [now-30*86400,''];
  if(state.period==='custom'){ const f=$('#periodFrom').value, t=$('#periodTo').value;
    return [f?new Date(f).getTime()/1000:'', t?new Date(t).getTime()/1000+59:'']; }
  return ['',''];
}
function buildQ(){ const r=range(), st=Object.keys(state.show).filter(k=>state.show[k]);
  Q={scope:state.scope,states:st.length?st.join(','):'none',q:state.q,term:state.term||'',from:r[0],to:r[1],
     sort:state.sort,group:state.arrange==='project'?'project':'',desc:state.newest?'1':''}; }
function qs(extra){ const p=new URLSearchParams(), o=Object.assign({},Q,extra||{});
  Object.keys(o).forEach(k=>{ if(o[k]!==''&&o[k]!=null) p.set(k,o[k]); }); return p.toString(); }
const scoped=()=>({scope:Q.scope,from:Q.from,to:Q.to,q:Q.q,term:Q.term});

/* ---------- loading ---------- */
async function loadOverview(g){
  const mine=++ovSeq;
  try{ const d=await api('/api/overview?'+qs({sessions:state.sessLimit,sq:state.sq})); if(g!==gen||mine!==ovSeq) return;
    if(version&&d.version!==version){ location.reload(); return; }      // Fermande was updated: take the new page too
    version=d.version; ov=d; online=true; stamp=d.stamp; nameProjects();
    if(state.asked&&!d.running){ const lr=d.last_review;
      say(lr&&lr.status==='failed'?'The review failed: '+(lr.error||'unknown reason'):'Reviewed '+n1(state.asked,'prompt')+'.'); state.asked=0; } }
  catch(e){ if(g!==gen||mine!==ovSeq) return; online=false; }
  renderChrome();
}
async function loadPage(p,g,force){
  if(!force&&(pages.has(p)||inflight.has(p))) return;
  const pr=api('/api/turns?'+qs({offset:p*PAGE,limit:PAGE})); inflight.set(p,pr);
  try{ const d=await pr; if(g!==gen) return;
    pages.set(p,d.items);
    Object.keys(d.reviews).forEach(k=>reviews.set(Number(k),d.reviews[k]));
    Object.keys(d.sessions).forEach(k=>sessMeta.set(k,d.sessions[k]));
    total=d.total; wordsTot=d.words; online=true;
    layout(); dirty=true; keepFocus(()=>{ renderTable(); paint(); });
  }catch(e){ if(g===gen){ online=false; renderChrome(); } }
  finally{ if(inflight.get(p)===pr) inflight.delete(p); }
}
async function loadCards(g){      // the Glossary view: one row for each term
  try{ const d=await api('/api/cards?'+qs({sort:state.cardSort.key,dir:state.cardSort.dir,group:'',desc:'',states:'',term:''})); if(g!==gen) return;
    cards=d; online=true; }
  catch(e){ if(g!==gen) return; cards={total:0,items:[],error:e.message}; }
  keepFocus(()=>{ renderTable(); paint(); });
}
function reload(){            // the filters or the order changed: start the list again
  buildQ(); gen++; pages=new Map(); inflight=new Map(); total=0; wordsTot=null; cards=null; drawn={first:-1,last:-1}; dirty=true;
  $('#logScroller').scrollTop=0; $('#cards').scrollTop=0; layout();
  return Promise.all([loadOverview(gen),state.view==='cards'?loadCards(gen):loadPage(0,gen)]);
}
function refresh(){           // the data changed: keep the place
  gen++; if(state.view==='cards') return Promise.all([loadOverview(gen),loadCards(gen)]);
  const keep=new Set(); if(drawn.first>=0){ for(let p=Math.floor(drawn.first/PAGE);p<=Math.floor(drawn.last/PAGE);p++) keep.add(p); } else keep.add(0);
  Array.from(pages.keys()).forEach(k=>{ if(!keep.has(k)) pages.delete(k); }); inflight=new Map();
  return Promise.all([loadOverview(gen)].concat(Array.from(keep).map(p=>loadPage(p,gen,true))));
}

/* ---------- names ---------- */
function nameProjects(){      // a project is named by its folder; two folders with one name also show their parent
  labels=new Map(); const seen=new Map(), list=(ov&&ov.projects)||[];
  list.forEach(p=>{ const n=base(p.project); seen.set(n,(seen.get(n)||0)+1); });
  list.forEach(p=>{ const a=parts(p.project), n=a.length?a[a.length-1]:'No project';
    labels.set(p.project,seen.get(base(p.project))>1&&a.length>1?a[a.length-2]+' / '+n:n); });
}
const projectLabel=p=>labels.get(p)||base(p)||'No project';
function where(){             // what the list shows: everything, one project or one session
  if(ov&&ov.where) return ov.where;
  if(!ov||state.scope==='all') return {kind:'all',n:ov?ov.all.n:0,sessions:ov?ov.all.sessions:0};
  const s=ov.sessions.find(x=>x.id===state.scope)||sessMeta.get(state.scope);
  return s?Object.assign({kind:'session',n:s.n||0},s):{kind:'gone',n:0};
}

/* ---------- the virtual list: only the rows near the window exist ---------- */
function item(i){ const a=pages.get(Math.floor(i/PAGE)); return a?a[i%PAGE]:null; }
function est(i){ const t=item(i); if(t){ const h=H[state.view].get(t.id); if(h) return h; } return state.view==='messages'?172:88; }
function layout(){ off=new Float64Array(total+1); for(let i=0;i<total;i++) off[i+1]=off[i]+est(i); }
function find(y){ let lo=0,hi=total; while(lo<hi){ const m=(lo+hi)>>1; if(off[m+1]<=y) lo=m+1; else hi=m; } return Math.min(lo,Math.max(0,total-1)); }
function paint(){
  const sc=$('#logScroller'), list=$('#logList'), win=$('#logWindow'), isCards=state.view==='cards';
  sc.hidden=isCards; $('#cards').hidden=!isCards;
  if(isCards){ renderCards(); return; }
  if(!total){ list.style.height='0px'; win.innerHTML=''; drawn={first:-1,last:-1}; renderEmpty(); return; }
  $('#emptyState').innerHTML='';
  const top=sc.scrollTop, vh=sc.clientHeight||600;
  const first=find(Math.max(0,top-OVER)), last=find(top+vh+OVER);
  for(let p=Math.floor(first/PAGE);p<=Math.floor(last/PAGE);p++) loadPage(p,gen);
  if(!dirty&&first===drawn.first&&last===drawn.last) return;
  const a=find(top), d=top-off[a];
  let h=''; for(let i=first;i<=last;i++) h+=rowHTML(i);
  win.innerHTML=h; win.style.transform='translateY('+off[first]+'px)'; list.style.height=(off[total]+72)+'px';
  drawn={first:first,last:last}; dirty=false;
  let changed=false; const hm=H[state.view];
  win.querySelectorAll('.log-row[data-id]').forEach(el=>{ const id=Number(el.dataset.id), hh=el.offsetHeight;
    if(Math.abs((hm.get(id)||0)-hh)>0.5){ hm.set(id,hh); changed=true; } });
  if(changed){
    layout(); win.style.transform='translateY('+off[first]+'px)'; list.style.height=(off[total]+72)+'px';
    const nt=off[a]+d; if(Math.abs(nt-sc.scrollTop)>1) sc.scrollTop=nt;
    schedule();
  }
}
function schedule(){ if(!raf) raf=requestAnimationFrame(()=>{ raf=0; keepFocus(paint); }); }

/* ---------- text with search hits, and with a lay phrase or a term marked ---------- */
function hits(t,q){
  t=String(t==null?'':t); if(!q) return esc(t);
  q=q.toLowerCase(); const low=t.toLowerCase(); let out='',p=0,at;
  while((at=low.indexOf(q,p))>=0){ out+=esc(t.slice(p,at))+'<span class="search-hit">'+esc(t.slice(at,at+q.length))+'</span>'; p=at+q.length; }
  return out+esc(t.slice(p));
}
const hi=t=>hits(t,state.q);           // hits of the prompt search, in the list
const hiSq=t=>hits(t,state.sq);        // hits of the session search, in the sidebar
function marked(text,pairs,field,cls,key){
  let segs=[{t:String(text||''),i:null}];
  pairs.forEach((p,i)=>{
    if(!p[field]) return;
    for(let k=0;k<segs.length;k++){
      const sg=segs[k]; if(sg.i!==null) continue;
      const at=sg.t.toLowerCase().indexOf(String(p[field]).toLowerCase()); if(at<0) continue;
      segs.splice(k,1,{t:sg.t.slice(0,at),i:null},{t:sg.t.slice(at,at+p[field].length),i:i},{t:sg.t.slice(at+p[field].length),i:null});
      break;
    }
  });
  return segs.filter(x=>x.t).map(x=>x.i===null?hi(x.t):'<mark class="'+cls+' pair-'+(x.i%4+1)+'" data-pair="'+key+':'+x.i+'">'+hi(x.t)+'</mark>').join('');
}
const pairLine=(t,p,i,stacked)=>'<li class="pair'+(stacked?' is-stacked':'')+'" data-pair="'+t.id+':'+i+'"><span class="lay-phrase pair-'+(i%4+1)+'">'+hi(p.said)+'</span>'+ARROW+'<span class="term pair-'+(i%4+1)+'">'+hi(p.term)+'</span>'+(p.gloss?'<span class="term-gloss">'+hi(p.gloss)+'</span>':'')+(p.used===false?UNUSED:'')+'</li>';
function systemNote(t){       // system text that an app put in front of the prompt: folded away, in its own block
  if(!t.lead||!t.lead.length) return '';
  const q=state.q.toLowerCase(), open=state.notes.has(t.id)||(!!q&&t.lead.some(b=>b.text.toLowerCase().indexOf(q)>=0));
  const label=t.lead.every(b=>b.kind==='system-reminder')?n1(t.lead.length,'system reminder'):n1(t.lead.length,'system note');
  return '<div class="system-note'+(open?' is-open':'')+'"><button class="system-note-toggle" data-act="note" data-id="'+t.id+'" data-fid="sn-'+t.id+'" aria-expanded="'+open+'">'+CHEVRON+'<span class="system-note-label">'+label+'</span><span class="system-note-hint">added by the app, not typed by you</span></button>'+
    (open?'<div class="system-note-body">'+t.lead.map(b=>'<div class="system-note-block"><span class="system-note-kind">'+esc(NOTE_KIND[b.kind]||b.kind)+'</span><p class="system-note-text">'+hi(b.text)+'</p></div>').join('')+'</div>':'')+'</div>';
}
const NOTHING='Only system text here. Nothing of your own in this prompt.';
const glyph=st=>'<svg class="state-glyph is-'+st+'" role="img" aria-label="'+LABEL[st]+'"><use href="#glyph-'+st+'"/></svg>';

/* ---------- rows of the list ---------- */
function projectHead(t){ const s=sessMeta.get(t.session_id)||{};
  return '<h2 class="project-head"><button class="project-title" data-act="scope" data-id="project:'+esc(s.project||'')+'" data-fid="ph-'+t.id+'" title="Show only this project">'+esc(projectLabel(s.project))+'</button><span class="project-path">'+esc(s.project||'')+'</span></h2>'; }
function sessionHead(t,kind){ const s=sessMeta.get(t.session_id)||{}, named=kind==='all'&&state.arrange!=='project'&&s.project;
  return '<h3 class="session-head"><button class="session-title" data-act="scope" data-id="'+esc(t.session_id)+'" data-fid="sh-'+t.id+'" title="Show only this session">'+esc(s.title||'Untitled session')+'</button>'+
    '<span class="session-facts">'+(named?'<span class="session-project">'+esc(projectLabel(s.project))+'</span>':'')+'<span class="session-dates">'+esc(spanText(s.started_at,s.last_at))+'</span></span></h3>'; }
function groupHead(t){
  const r=t.review_id?reviews.get(t.review_id):null;
  if(r){
    const span=(r.to-r.from+1===r.turns)?(r.turns===1?'prompt '+r.from:'prompts '+r.from+' to '+r.to):n1(r.turns,'prompt');
    return '<div class="group-head"><span><b class="group-name">Review '+r.n+'</b><span class="group-span">'+span+'</span></span><span class="group-info">'+(r.by==='hand'?'Asked by hand':'Automatic')+', '+esc(cap(r.model))+', '+fmt(r.at)+'</span></div>';
  }
  const s=sessMeta.get(t.session_id)||{}, c=ov?ov.config:{mode:'automatic',every:10}, max=ov?ov.max_review:300;
  const pend=s.pending||0, live=s.pending_live||0, left=c.every-live;
  const hint=c.mode==='off'?'The coach is off':c.mode==='by_hand'?'Waiting for you to ask':
    !live?'From your history, reviewed when you ask':left>0?n1(left,'more prompt')+' until the next review':'A review is due at the next reply';
  return '<div class="group-head"><span><b class="group-name">Not reviewed yet</b><span class="group-span">'+n1(pend,'prompt')+' in this session</span></span><span class="group-actions"><span class="group-info">'+hint+'</span>'+
    '<button class="button button-small" data-act="review-session" data-id="'+esc(t.session_id)+'" data-fid="rs-'+esc(t.session_id)+'-'+t.id+'"'+(pend?'':' disabled')+'>'+(pend>max?'Review latest '+max:'Review '+num(pend)+' now')+'</button></span></div>';
}
function groupSummary(t){
  const r=t.review_id?reviews.get(t.review_id):null;
  if(!r||r.turns<2||t.n!==(state.newest?r.from:r.to)||state.term||state.q) return '';
  const rest=r.turns-r.better;
  return '<div class="group-summary"><p><b>Coach</b>'+r.better+' of these '+r.turns+' prompts could be better.'+(rest?' '+rest+(rest===1?' was':' were')+' already precise.':'')+'</p>'+
    (r.pairs.length?'<div class="terms-kept"><span class="terms-kept-label">Terms to keep</span>'+r.pairs.map(p=>'<span class="term-pair"><span class="lay-phrase">'+esc(p.said)+'</span>'+ARROW+'<span class="term">'+esc(p.term)+'</span></span>').join('')+'</div>':'')+'</div>';
}
function promptGutter(t,more){
  const on=state.sel.has(t.id), open=state.open.has(t.id);
  return '<div class="prompt-gutter"><button class="prompt-number" data-act="select" data-id="'+t.id+'" data-fid="pk-'+t.id+'" aria-pressed="'+on+'" title="'+(on?'Remove from the selection':'Select to review')+'" aria-label="'+(on?'Deselect':'Select')+' prompt '+t.n+'">'+t.n+'</button>'+glyph(t.state)+
    (more?'<button class="prompt-expand" data-act="expand" data-id="'+t.id+'" data-fid="mo-'+t.id+'" aria-expanded="'+open+'" title="'+(open?'Hide':'Show')+' details" aria-label="'+(open?'Hide':'Show')+' details of prompt '+t.n+'">'+CHEVRON+'</button>':'')+'</div>';
}
const wordCount=(n,better)=>'<span class="word-count"><i class="word-bar'+(better?' is-better':'')+'" style="width:'+Math.min(132,Math.max(4,Math.round(n*3.3)))+'px"></i>'+n1(n,'word')+'</span>';
function betterCell(t,open){
  if(t.running) return '<p class="muted-text">Reviewing…</p>';
  if(t.state==='pending') return '<p class="muted-text">Not reviewed yet.</p><button class="button button-small" data-act="review-one" data-id="'+t.id+'" data-fid="ro-'+t.id+'">Review this one</button>';
  if(t.state==='precise') return '<p class="muted-text">Already precise. Nothing to change.</p>';
  return '<p class="better-text">'+marked(t.better,t.pairs,'term','term',t.id)+'</p>'+
    (t.pairs.length?'<ul class="pair-list">'+t.pairs.map((p,i)=>pairLine(t,p,i,true)).join('')+'</ul>':'')+
    '<div class="cell-foot">'+wordCount(t.better_words||0,true)+'<button class="text-button text-button-small" data-act="copy" data-id="'+t.id+'" data-fid="cp-'+t.id+'">'+(state.copied==='c:'+t.id?'Copied':'Copy')+'</button></div>'+
    (open&&t.why?'<p class="review-reason"><b>How the coach knew</b>'+esc(t.why)+'</p>':'');
}
function promptRow(t){
  const open=state.open.has(t.id), long=t.said.length>900;
  const more=(state.replies&&t.reply&&t.reply.length>150)||(t.state==='better'&&t.why)||long;
  return '<article class="prompt-row'+(open?' is-open':'')+(state.sel.has(t.id)?' is-selected':'')+'" aria-label="Prompt '+t.n+', '+LABEL[t.state]+'">'+promptGutter(t,more)+
    '<div class="said-cell"><span class="cell-label">You said</span>'+systemNote(t)+(t.said?'<p class="said-text'+(long&&!open?' is-clamped':'')+'">'+marked(t.said,t.state==='better'?t.pairs:[],'said','lay-phrase',t.id)+'</p>':'<p class="muted-text">'+NOTHING+'</p>')+'<div class="cell-foot">'+wordCount(t.said_words,false)+'<span class="prompt-time">'+fmt(t.at)+'</span></div></div>'+
    '<div class="better-cell"><span class="cell-label">Better</span>'+betterCell(t,open)+'</div>'+
    (state.replies?'<div class="reply"><span class="reply-author">Claude</span><p class="reply-text">'+(t.reply?hi(t.reply):'No reply was logged for this prompt.')+'</p><span class="reply-files">'+t.files.map(f=>'<span class="file-chip" title="'+esc(f)+'">'+esc(base(f))+'</span>').join('')+'</span></div>':'')+
    '</article>';
}
function reviewRow(t){
  const open=state.open.has(t.id), long=t.said.length>320||t.said.split('\n').length>6, more=long||(t.state==='better'&&!!t.why);
  const said='<div class="review-cell review-said"><span class="cell-label">You said</span>'+systemNote(t)+
    (t.said?'<div class="review-said-text'+(long&&!open?' is-clamped':'')+'">'+marked(t.said,t.state==='better'?t.pairs:[],'said','lay-phrase',t.id)+'</div>':'<span class="muted-text">'+NOTHING+'</span>')+'</div>';
  const cls='review-row'+(state.sel.has(t.id)?' is-selected':'')+(open?' is-open':'');
  if(t.state!=='better'||t.running) return '<div class="'+cls+'">'+promptGutter(t,more)+said+'<div class="review-cell review-status">'+(t.running?'Reviewing…':t.state==='precise'?'Already precise. Nothing to change.':'Not reviewed yet.')+'</div></div>';
  return '<div class="'+cls+'">'+promptGutter(t,more)+said+
    '<div class="review-cell review-meant"><span class="cell-label">Meant</span>'+(t.pairs.length?'<ul class="pair-list">'+t.pairs.map((p,i)=>pairLine(t,p,i,true)).join('')+'</ul>':'<span class="muted-text">No new term. The gain is a shorter, clearer prompt.</span>')+'</div>'+
    '<div class="review-cell review-better"><span class="cell-label">Better</span>'+marked(t.better,t.pairs,'term','term',t.id)+(open&&t.why?'<p class="review-reason"><b>How the coach knew</b>'+esc(t.why)+'</p>':'')+'</div>'+
    '<div class="review-cell review-words"><span class="cell-label">Words</span>'+t.said_words+ARROW.replace(' means ',' to ')+(t.better_words||0)+'<span class="review-words-unit"> words</span></div></div>';
}
function rowHTML(i){
  const t=item(i);
  if(!t) return '<div class="log-row is-loading" style="height:'+est(i)+'px">Loading…</div>';
  const kind=scopeKind(); let h='';
  if(t.first&&i>0) h+=DIVIDER;
  if(t.new_project&&kind==='all'&&state.arrange==='project') h+=projectHead(t);
  if(t.new_session&&kind!=='session') h+=sessionHead(t,kind);
  if(t.first) h+=groupHead(t);
  h+=state.view==='messages'?promptRow(t):reviewRow(t);
  if(t.last&&state.view==='messages') h+=groupSummary(t);
  return '<div class="log-row" data-id="'+t.id+'">'+h+'</div>';
}

/* ---------- app bar ---------- */
const MODES=[['automatic','Automatic'],['by_hand','By hand'],['off','Off']];
const segmented=(act,key,fid,list,cur)=>list.map(m=>'<button role="radio" aria-checked="'+(cur===m[0])+'" data-act="'+act+'" data-'+key+'="'+esc(m[0])+'" data-fid="'+fid+esc(m[0])+'">'+esc(m[1])+'</button>').join('');
function modeText(c){ return c.mode==='automatic'?'A review runs after every '+c.every+' new prompts of a session.':c.mode==='by_hand'?'Prompts are logged. A review runs only when you ask.':'Nothing is logged and no review runs.'; }
function cfgText(c){ return '{\n  "mode": "'+c.mode+'",\n  "every": '+c.every+',\n  "model": "'+c.model+'",\n  "send": ['+c.send.map(x=>'"'+x+'"').join(', ')+'],\n  "reply_chars": '+c.reply_chars+'\n}'; }
function renderLocation(){
  const el=$('#location'); if(!ov){ el.innerHTML=''; return; }
  const w=where(), narrowed=pages.size>0&&total!==w.n;
  const count='<span class="location-count">'+(state.view==='cards'?(cards?n1(cards.total,'term'):''):narrowed?num(total)+' of '+n1(w.n,'prompt'):n1(w.n,'prompt'))+'</span>';
  if(w.kind==='session')
    el.innerHTML=(w.project?'<button class="location-project" data-act="scope" data-id="project:'+esc(w.project)+'" data-fid="loc-project" title="'+esc('Show every session of '+w.project)+'">'+esc(projectLabel(w.project))+'</button><span class="location-separator" aria-hidden="true">/</span>':'')+
      '<h1 class="location-title location-session" title="'+esc(w.title)+'">'+esc(w.title)+'</h1>'+
      '<span class="location-facts"><span class="location-dates">'+esc(spanText(w.started_at,w.last_at))+'</span>'+count+'</span>';
  else if(w.kind==='project')
    el.innerHTML='<h1 class="location-title location-project-name" title="'+esc(w.project)+'">'+esc(projectLabel(w.project))+'</h1>'+
      '<span class="location-facts"><span class="location-sessions">'+n1(w.sessions,'session')+'</span>'+count+'</span>';
  else if(w.kind==='gone') el.innerHTML='<h1 class="location-title">This session is no longer in the log</h1>';
  else el.innerHTML='<h1 class="location-title">All sessions</h1><span class="location-facts"><span class="location-sessions">'+n1(w.sessions,'session')+'</span>'+count+'</span>';
}
function renderBar(){

  chip.className='status-chip '+(online?'is-live':'is-offline'); chip.textContent=online?'Live':'Offline';
  chip.title=online?'Reading '+(ov?ov.home_short:'')+'/fermande.db':'The page cannot reach Fermande. Run "fermande open" again.';

  if(c){ mode.textContent='Coach: '+(c.mode==='automatic'?'automatic':c.mode==='by_hand'?'by hand':'off'); mode.title=modeText(c)+' Click to change it.'; mode.classList.toggle('is-offline',c.mode==='off'); }
  $('#viewSwitch').innerHTML=segmented('view','v','view-',VIEWS,state.view);

   '<div class="config-head has-rule"><span class="config-path">'+esc(ov.home_short)+'/config.json</span><button class="text-button" data-act="copy-config" data-fid="copy-config">'+(state.copied==='cfg'?'Copied':'Copy')+'</button></div>'+
   '<pre class="config-file">'+esc(cfgText(c))+'</pre>'+
   '<p class="hint">The hooks read this file at every prompt, so a change here applies from the next one. The log is '+esc(ov.home_short)+'/fermande.db.</p>'+

     '<p class="hint">A small server on '+esc(location.host)+' shows you this page. It answers only on this computer and stops by itself after '+c.idle_minutes+' idle minutes. Logging and reviews do not need it. To start it again, run fermande open or type /fermande in a session.</p></div>';

    if(ok) setTimeout(()=>{ if(state.copied===id){ state.copied=null; render(); } },1600); };

document.addEventListener('click',e=>{

  if(state.settings&&!e.target.closest('#settingsPanel,.scroll-rail')&&!(b&&b.dataset.act==='settings')){ state.settings=false; if(!b){ render(); return; } }
  if(!b||b.disabled) return;
  const d=b.dataset, c=ov?ov.config:null, id=Number(d.id);
  switch(d.act){
    case 'scope': { state.scope=d.id; state.term=null; state.sel.clear();
      if(d.id.indexOf('project:')===0) state.expanded.add(d.id.slice(8));      // the sidebar opens the project you are looking at
      else if(d.id!=='all'){ const s=(ov?ov.sessions.find(x=>x.id===d.id):null)||sessMeta.get(d.id); if(s&&s.project) state.expanded.add(s.project); }
      save(); reload(); break; }
    case 'project-toggle': state.expanded.has(d.project)?state.expanded.delete(d.project):state.expanded.add(d.project); save(); break;
    case 'view-options': state.viewOptions=!state.viewOptions; break;
    case 'arrange': state.arrange=d.v; save(); reload(); break;
    case 'sort': state.sort=d.v; save(); reload(); break;
    case 'prompt-order': state.newest=d.v==='newest'; save(); reload(); break;
    case 'entry-show': state.entry[d.k]=!state.entry[d.k]; save(); break;
    case 'section-toggle': state.closed.has(d.s)?state.closed.delete(d.s):state.closed.add(d.s); save(); break;
    case 'period': state.period=d.p; state.sel.clear(); reload(); break;
    case 'show': state.show[d.s]=!state.show[d.s]; reload(); break;
    case 'only': Object.keys(state.show).forEach(k=>state.show[k]=k===d.s); reload(); break;
    case 'term': state.term=state.term===d.t?null:d.t; reload(); break;
    case 'reset': showAll(); reload(); break;
    case 'reset-all': showAll(); state.period='all'; state.scope='all'; reload(); break;
    case 'more-sessions': state.sessLimit+=300; refresh(); return;
    case 'view': if(d.v===state.view) return;
      if(d.v==='cards'||state.view==='cards'){ state.view=d.v; save(); reload(); } else { keepTop(()=>{ state.view=d.v; }); save(); } break;
    case 'note': state.notes.has(id)?state.notes.delete(id):state.notes.add(id); break;
    case 'card-sort': state.cardSort=state.cardSort.key===d.k?{key:d.k,dir:state.cardSort.dir==='asc'?'desc':'asc'}:{key:d.k,dir:d.k==='last_at'||d.k==='times'?'desc':'asc'}; save(); reload(); break;
    case 'term-prompts': state.term=d.t; state.view='messages'; save(); reload(); break;
    case 'sidebar-collapse': keepTop(()=>{ state.collapsed=!state.collapsed; H.messages.clear(); H.reviews.clear(); }); save(); break;
    case 'rail-search': state.collapsed=false; save(); render(); $('#sessionSearch').focus(); return;
    case 'replies': keepTop(()=>{ state.replies=!state.replies; H.messages.clear(); }); save(); break;
    case 'terms-all': state.allTerms=!state.allTerms; break;
    case 'expand': state.open.has(id)?state.open.delete(id):state.open.add(id); break;
    case 'select': state.sel.has(id)?state.sel.delete(id):state.sel.add(id); break;
    case 'clear-selection': state.sel.clear(); break;
    case 'select-all': api('/api/ids?'+qs()).then(r=>{ if(r.ids.length>(ov?ov.max_review:300)) say('More than '+(ov?ov.max_review:300)+' prompts match. Narrow the period first.'); else state.sel=new Set(r.ids); render(); },err=>{ say(err.message); render(); }); return;
    case 'review-selected': review({ids:Array.from(state.sel)}); return;
    case 'review-one': review({ids:[id]}); return;
    case 'review-session': review({pending:{scope:d.id}}); return;
    case 'review-scope': review({pending:scoped()}); return;
    case 'copy': { const t=byId(id); if(t) copy(t.better,'c:'+id); return; }
    case 'copy-config': copy(cfgText(c),'cfg'); return;
    case 'mode': setConfig({mode:d.m}); return;
    case 'model': setConfig({model:d.m}); return;
    case 'step': setConfig({every:c.every+Number(d.d)}); return;
    case 'send': { const s=c.send.slice(), i=s.indexOf(d.c); if(i>=0) s.splice(i,1); else s.push(d.c); setConfig({send:s}); return; }
    case 'import': api('/api/import',{}).then(()=>{ say('Reading Claude Code\'s history in the background.'); refresh(); },err=>{ say(err.message); render(); }); return;
    case 'editor-open': editorOpen(); return;
    case 'editor-save': editorSave(false); return;
    case 'editor-reset': editorSave(true); return;
    case 'editor-close': editorClose(false); return;
    case 'shutdown': state.settings=false; state.stopped=true; api('/api/shutdown',{}).then(()=>{ online=false; total=0; pages=new Map(); say('The server is stopped.'); render(); },err=>{ say(err.message); render(); }); return;
    case 'settings': state.settings=!state.settings; break;
    case 'theme': document.documentElement.dataset.theme=theme()==='dark'?'light':'dark'; save(); break;
    case 'sidebar-toggle': state.sidebarOpen=!state.sidebarOpen; break;
  }
  render();
});

/* two search boxes: the one in the sidebar narrows the sessions listed, the one above the list narrows the prompts */
let promptTimer=0, sessionTimer=0;
$('#promptSearch').addEventListener('input',e=>{ clearTimeout(promptTimer); promptTimer=setTimeout(()=>{ state.q=e.target.value.trim(); reload(); },220); });
$('#sessionSearch').addEventListener('input',e=>{ clearTimeout(sessionTimer); sessionTimer=setTimeout(()=>{ state.sq=e.target.value.trim(); loadOverview(gen); },160); });
$('#instructionsText').addEventListener('input',()=>{ $('#editorClose').textContent='Close'; $('#editorNote').textContent=editorDirty()?'Not saved yet.':''; });
['#periodFrom','#periodTo'].forEach(s=>$(s).addEventListener('change',()=>{ if(state.period==='custom'){ state.sel.clear(); reload(); } }));
$('#logScroller').addEventListener('scroll',schedule,{passive:true});
let resizeTimer=0; window.addEventListener('resize',()=>{ clearTimeout(resizeTimer); resizeTimer=setTimeout(()=>{ keepTop(()=>{ H.messages.clear(); H.reviews.clear(); }); dirty=true; paint(); },120); });

document.addEventListener('keydown',e=>{
  const tag=document.activeElement?document.activeElement.tagName:'';
  if(e.key==='/'&&tag!=='INPUT'&&tag!=='TEXTAREA'&&!e.metaKey&&!e.ctrlKey){ e.preventDefault(); $('#promptSearch').focus(); }
  else if(e.key==='Escape'){
    if(!$('#instructionsEditor').hidden){ editorClose(false); }
    else if(state.settings){ state.settings=false; render(); $('#settingsButton').focus(); }
    else if(state.sel.size){ state.sel.clear(); render(); }
    else if(state.q){ state.q=''; $('#promptSearch').value=''; reload(); }
    else if(state.sq){ state.sq=''; $('#sessionSearch').value=''; loadOverview(gen); }
    else if(state.term){ state.term=null; reload(); }
    else if(state.viewOptions){ state.viewOptions=false; render(); }
    else if(state.open.size){ state.open.clear(); render(); }
  }
});

/* Hover a lay phrase or its term: the pair lights up and the rest of the row dims. */
let lit=null;
function unlight(){ if(!lit) return; lit.row.classList.remove('is-focused'); lit.els.forEach(x=>x.classList.remove('is-lit')); lit=null; }
$('#logScroller').addEventListener('mouseover',e=>{
  const el=e.target.closest('[data-pair]'); if(!el){ unlight(); return; }
  if(lit&&lit.key===el.dataset.pair&&lit.row.isConnected) return;
  unlight();
  const row=el.closest('.prompt-row,.review-row'); if(!row) return;
  const els=Array.from(row.querySelectorAll('[data-pair="'+el.dataset.pair+'"]'));
  row.classList.add('is-focused'); els.forEach(x=>x.classList.add('is-lit')); lit={key:el.dataset.pair,row:row,els:els};
});
$('#logScroller').addEventListener('mouseleave',unlight);

/* The page asks Fermande every few seconds whether its log changed, and reloads what is on screen when it did. */
setInterval(async()=>{
  try{ const s=await api('/api/stamp');
    if(s.build){ if(build&&s.build!==build){ location.reload(); return; } build=s.build; }      // Fermande was updated: take the new page
    if(!online){ online=true; reload(); }
    else if(s.stamp!==stamp){ stamp=s.stamp; refresh(); }
  }catch(e){ if(online){ online=false; renderChrome(); } }
},2500);
if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change',renderBar);

/* ---------- scroll rail ----------
   A thin bar at the edge of a scrolling box that shows where you are, in place of the browser's
   scrollbar. This is the plain-script twin of the Daybook's scrollRail.ts: one rail for each axis
   that the box scrolls on, a thumb that follows scrolling, resizing and changes of content, a thumb
   that can be dragged and a track that can be clicked. A rail shows only while there is something
   to scroll. RAIL_BOXES names every box on this page that scrolls; a box that the page draws again
   gets its rail back by itself. */
const RAIL_BOXES=['#logScroller','#cards','.sidebar-scroll','.rail-projects','#settingsPanel','.config-file','#instructionsText','#instructionsFormat','#sidebar'];
function attachScrollRail(scroller,minThumb){
  const cs=getComputedStyle(scroller), scrolls=v=>v==='auto'||v==='scroll';
  const axes=(scrolls(cs.overflowY)?['y']:[]).concat(scrolls(cs.overflowX)?['x']:[]);
  if(!axes.length) return;                      // not a scrolling box at this window size; looked at again later
  const host=scroller.parentElement; if(getComputedStyle(host).position==='static') host.classList.add('rail-host');
  minThumb=minThumb||24;
  const rails=axes.map(axis=>{ const rail=document.createElement('div'), thumb=document.createElement('i');
    rail.className='scroll-rail'+(axis==='x'?' is-horizontal':''); rail.setAttribute('aria-hidden','true'); rail.appendChild(thumb); host.appendChild(rail);
    return {axis:axis,rail:rail,thumb:thumb,from:null,was:''}; });
  const measure=axis=>{ const vert=axis==='y'; return {vert:vert,size:vert?scroller.clientHeight:scroller.clientWidth,total:vert?scroller.scrollHeight:scroller.scrollWidth,pos:vert?scroller.scrollTop:scroller.scrollLeft}; };
  const scrollTo=(axis,to)=>{ if(axis==='y') scroller.scrollTop=to; else scroller.scrollLeft=to; };
  const px=(st,name,d)=>{ const v=parseFloat(st.getPropertyValue(name)); return isNaN(v)?d:v; };
  let frame=0;
  function sync(){
    frame=0;
    if(!scroller.isConnected){ detach(); return; }
    const st=getComputedStyle(scroller), thick=px(st,'--rail-size',5), a=px(st,'--rail-top',6), b=px(st,'--rail-bottom',6), edge=px(st,'--rail-right',3);
    const x0=scroller.offsetLeft+scroller.clientLeft, y0=scroller.offsetTop+scroller.clientTop;      // the box's place inside its host
    rails.forEach(r=>{
      const m=measure(r.axis), over=m.total-m.size, track=m.size-a-b;
      if(over<=1||track<=4){ r.rail.classList.remove('is-on'); if(r.was){ r.was=''; r.rail.style.cssText=''; } return; }    // off: back to no size, so it cannot widen the page
      const th=Math.max(Math.min(minThumb,track),Math.min(track,m.size/m.total*track)), at=m.pos/over*(track-th);
      const box=m.vert?[x0+scroller.clientWidth-thick-edge,y0+a,thick,track]:[x0+a,y0+scroller.clientHeight-thick-edge,track,thick];
      const now=box.join(' ')+' '+th.toFixed(1)+' '+at.toFixed(1);
      if(now!==r.was){ r.was=now;
        r.rail.style.cssText='left:'+box[0]+'px;top:'+box[1]+'px;width:'+box[2]+'px;height:'+box[3]+'px';
        r.thumb.style.cssText=m.vert?'height:'+th+'px;transform:translateY('+at+'px)':'width:'+th+'px;transform:translateX('+at+'px)'; }
      r.rail.classList.add('is-on');
    });
  }
  const schedule=()=>{ if(!frame) frame=requestAnimationFrame(sync); };
  scroller.addEventListener('scroll',schedule,{passive:true});
  scroller.addEventListener('input',schedule);          // a text box grows as it is typed in
  const ro=new ResizeObserver(schedule); ro.observe(scroller);
  const mo=new MutationObserver(schedule); mo.observe(scroller,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['style','hidden','open']});
  rails.forEach(r=>{
    r.rail.addEventListener('pointerdown',e=>{
      if(e.button!==0) return; e.preventDefault(); e.stopPropagation();
      const m=measure(r.axis), over=m.total-m.size; if(over<=1) return;
      const thumbSize=m.vert?r.thumb.offsetHeight:r.thumb.offsetWidth, track=(m.vert?r.rail.clientHeight:r.rail.clientWidth)-thumbSize;
      let at=m.pos;
      if(e.target!==r.thumb&&track>0){            // a press on the track jumps there, then the thumb can be dragged on
        const rect=r.rail.getBoundingClientRect();
        scrollTo(r.axis,((m.vert?e.clientY-rect.top:e.clientX-rect.left)-thumbSize/2)/track*over); at=measure(r.axis).pos; }
      r.from={p:m.vert?e.clientY:e.clientX,at:at,over:over,track:track}; r.rail.classList.add('is-drag'); r.rail.setPointerCapture(e.pointerId);
    });
    r.rail.addEventListener('pointermove',e=>{ if(!r.from||r.from.track<=0) return; scrollTo(r.axis,r.from.at+((r.axis==='y'?e.clientY:e.clientX)-r.from.p)/r.from.track*r.from.over); });
    const up=()=>{ r.from=null; r.rail.classList.remove('is-drag'); };
    r.rail.addEventListener('pointerup',up); r.rail.addEventListener('pointercancel',up);
  });
  function detach(){ if(frame) cancelAnimationFrame(frame); ro.disconnect(); mo.disconnect(); rails.forEach(r=>r.rail.remove()); delete scroller._rail; }
  scroller._rail={schedule:schedule,detach:detach};
  sync();
}
function attachRails(){ document.querySelectorAll(RAIL_BOXES.join(',')).forEach(el=>{ if(el._rail) el._rail.schedule(); else attachScrollRail(el); }); }
let railFrame=0;
const railsSoon=()=>{ if(!railFrame) railFrame=requestAnimationFrame(()=>{ railFrame=0; attachRails(); }); };
new MutationObserver(railsSoon).observe(document.body,{childList:true,subtree:true});
window.addEventListener('resize',railsSoon);
if(document.fonts&&document.fonts.addEventListener) document.fonts.addEventListener('loadingdone',railsSoon);   // a late font changes how long the content is

renderChrome(); reload(); attachRails();
})();
</script>
